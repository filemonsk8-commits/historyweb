<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10243b">
    <title>Linha do Tempo Histórica - Modular</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #334155;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            font-size: 1.25rem; /* Fonte base aumentada */
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 3rem; /* Título principal maior */
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 700;
        }

        /* Barra de Pesquisa */
        .busca-container {
            max-width: 950px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 12px;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }

        .busca-container input {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.2rem; /* Input de pesquisa maior */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            color: var(--text-main);
        }

        .busca-container input:focus {
            border-color: var(--primary-color);
        }

        .busca-container button {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0 24px;
            font-size: 1.2rem; /* Botão de pesquisa maior */
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .busca-container button:hover {
            background: var(--primary-hover);
        }

        /* Menu de Navegação */
        .menu-navegacao {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .btn-periodo {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            font-size: 1.15rem; /* Botões do menu maiores */
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-periodo:hover {
            background: #f1f5f9;
            border-color: var(--primary-color);
        }

        /* Aba Ativa Destacada no Menu */
        .btn-periodo.ativo {
            background: #1e40af;
            color: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* Envoltório com Fundo Personalizado (fundo.jpg) */
        .conteudo-wrapper {
            background-image: linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.78)), url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .capa-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .capa-titulo-secao {
            font-size: 2.5rem; /* Título da capa maior */
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .capa-sub-secao {
            color: #e2e8f0;
            margin-bottom: 40px;
            font-size: 1.3rem; /* Subtítulo da capa maior */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .capa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            padding: 10px 0;
        }

        .capa-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 32px 24px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .capa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
            background: #ffffff;
            border-color: var(--primary-color);
        }

        .capa-card h3 {
            font-size: 1.6rem; /* Títulos dos cards da capa maiores */
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .capa-card p {
            font-size: 1.15rem; /* Textos dos cards da capa maiores */
            color: var(--text-muted);
            line-height: 1.6;
        }

        .capa-card-footer {
            margin-top: 22px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Cards Históricos */
        .historico-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .historico-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        @media (min-width: 640px) {
            .historico-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .historico-tag {
            background: #dbeafe;
            color: var(--primary-color);
            font-size: 1.15rem; /* Tag do período maior */
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            width: fit-content;
        }

        .historico-intervalo {
            font-size: 1.2rem; /* Anos do intervalo maiores */
            color: var(--text-muted);
            font-weight: 600;
        }

        .historico-card h2 {
            font-size: 2.1rem; /* Título principal do card maior */
            color: var(--text-main);
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .secao-texto {
            font-size: 1.25rem; /* Parágrafos e textos gerais maiores */
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 14px;
        }

        .acordeao-container {
            margin-top: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
        }

        .acordeao-botao {
            width: 100%;
            background: #f8fafc;
            border: none;
            padding: 20px 24px;
            text-align: left;
            font-size: 1.3rem; /* Botões de acordeão maiores */
            font-weight: 700;
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .acordeao-botao:hover {
            background: #f1f5f9;
        }

        .acordeao-botao::after {
            content: '▼';
            font-size: 1rem;
            transition: transform 0.3s;
        }

        .acordeao-botao.ativo::after {
            transform: rotate(180deg);
        }

        .acordeao-conteudo {
            display: none;
            padding: 28px;
            background: #ffffff;
            border-top: 1px solid #cbd5e1;
        }

        .acordeao-conteudo.aberto {
            display: block;
        }

        .grid-causas {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        @media (min-width: 640px) {
            .grid-causas {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .causa-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 8px;
            font-size: 1.2rem; /* Texto de causas maior */
            color: var(--text-muted);
            line-height: 1.6;
        }

        .causa-item strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 6px;
            font-size: 1.25rem;
        }

        .lista-itens {
            padding-left: 24px;
            margin-top: 10px;
        }

        .lista-itens li {
            font-size: 1.2rem; /* Itens de listas maiores */
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.7;
        }

        .sub-timeline {
            position: relative;
            padding-left: 32px;
            border-left: 3px solid var(--primary-color);
            margin-left: 10px;
        }

        .timeline-evento {
            position: relative;
            margin-bottom: 35px;
        }

        .timeline-evento:last-child {
            margin-bottom: 0;
        }

        .timeline-evento::before {
            content: '';
            position: absolute;
            left: -37px;
            top: 4px;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .evento-ano {
            font-size: 1.15rem; /* Anos na sub-timeline maiores */
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .evento-titulo {
            font-size: 1.35rem; /* Títulos de eventos na sub-timeline maiores */
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .resultado-busca {
            margin: 0 0 20px;
            padding: 12px 16px;
            border-left: 3px solid #b18a4a;
            background: rgba(255,255,255,0.94);
            color: #17365d;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .erro-msg {
            text-align: center;
            color: #ef4444;
            padding: 30px;
            font-size: 1.3rem;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
        }
    
        
        /* ===== IDENTIDADE VISUAL ACADÊMICA — ETAPA 1 ===== */
        :root {
            --primary-color: #17365d;
            --primary-hover: #244d78;
            --bg-color: #f3f1eb;
            --card-bg: #ffffff;
            --text-main: #172536;
            --text-muted: #465568;
            --border-color: #d9dfe5;
            --accent-color: #b18a4a;
        }

        body {
            background:
                radial-gradient(circle at 12% 0%, rgba(177, 138, 74, 0.09), transparent 28rem),
                #f3f1eb;
            color: var(--text-main);
            padding: 34px 24px 56px;
            font-size: 1.08rem;
            line-height: 1.65;
        }

        header {
            max-width: 1120px;
            margin: 0 auto 26px;
            padding: 24px 18px 28px;
            border-bottom: 1px solid #d7d0c2;
            position: relative;
        }

        header::after {
            content: "ACERVO DIGITAL DE HISTÓRIA";
            display: block;
            margin-top: 8px;
            color: #7b6a4e;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.19em;
        }

        header h1 {
            color: #17365d;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 4vw, 3.15rem);
            letter-spacing: -0.035em;
            line-height: 1.15;
        }

        .busca-container {
            max-width: 1000px;
            margin-bottom: 26px;
            padding: 12px;
            gap: 10px;
            border: 1px solid #dce1e5;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(25, 42, 60, 0.06);
        }

        .busca-container input {
            min-width: 0;
            padding: 14px 16px;
            font-size: 1rem;
            background: #fbfcfd;
            border-color: #d9dfe5;
        }

        .busca-container input:focus {
            border-color: #b18a4a;
            box-shadow: 0 0 0 3px rgba(177, 138, 74, 0.15);
        }

        .busca-container button {
            min-height: 48px;
            padding: 0 22px;
            background: #17365d;
            font-size: 0.98rem;
        }

        .busca-container button:hover {
            background: #244d78;
        }

        .menu-navegacao {
            max-width: 1120px;
            margin: 0 auto 34px;
            gap: 9px;
        }

        .btn-periodo {
            padding: 10px 15px;
            border-radius: 999px;
            border-color: #d8dfe5;
            color: #26394f;
            font-size: 0.92rem;
            font-weight: 600;
            background: rgba(255,255,255,0.88);
        }

        .btn-periodo:hover {
            color: #17365d;
            background: #fff;
            border-color: #b18a4a;
            transform: translateY(-1px);
        }

        .btn-periodo.ativo {
            background: #17365d;
            color: #fff;
            border-color: #17365d;
            box-shadow: 0 4px 12px rgba(23, 54, 93, 0.18);
        }

        .container {
            max-width: 1120px;
        }

        .conteudo-wrapper {
            background-image:
                linear-gradient(rgba(17, 34, 55, 0.91), rgba(17, 34, 55, 0.94)),
                url('fundo.jpg');
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 18px;
            padding: clamp(22px, 4vw, 42px);
            box-shadow: 0 18px 46px rgba(19, 35, 52, 0.16);
        }

        .capa-titulo-secao {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.8rem, 3.5vw, 2.55rem);
            letter-spacing: -0.025em;
        }

        .capa-sub-secao {
            max-width: 660px;
            margin: 0 auto 32px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #dbe3ec;
        }

        .capa-grid {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 17px;
        }

        .capa-card {
            font: inherit;
            color: inherit;
            width: 100%;
            text-align: left;
            min-height: 190px;
            padding: 25px 23px;
            background: #fff;
            border: 1px solid #e4e7eb;
            border-top: 3px solid #b18a4a;
            border-radius: 12px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.12);
        }

        .capa-card:hover {
            transform: translateY(-3px);
            border-color: #c8ad7b;
            border-top-color: #b18a4a;
            box-shadow: 0 14px 28px rgba(0,0,0,0.18);
        }

        .capa-card h3 {
            color: #17365d;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            line-height: 1.3;
        }

        .capa-card p {
            color: #536174;
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .capa-card-footer {
            color: #80612f;
            font-size: 0.9rem;
        }

        .historico-card {
            padding: clamp(22px, 3.5vw, 38px);
            margin-bottom: 22px;
            background: #fff;
            border: 1px solid #e2e6e9;
            border-left: 4px solid #b18a4a;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(14, 30, 48, 0.09);
        }

        .historico-header {
            border-bottom: 1px solid #e8ebee;
            padding-bottom: 17px;
            margin-bottom: 20px;
        }

        .historico-tag {
            background: #edf2f7;
            color: #17365d;
            padding: 6px 13px;
            font-size: 0.86rem;
            border-radius: 6px;
        }

        .historico-intervalo {
            color: #657386;
            font-size: 0.92rem;
        }

        .historico-card h2 {
            color: #17365d;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.45rem, 2.6vw, 1.9rem);
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .secao-texto {
            color: #465568;
            font-size: 1.02rem;
            line-height: 1.78;
        }

        .acordeao-container {
            margin-top: 13px;
            border: 1px solid #e0e5e9;
            border-radius: 9px;
        }

        .acordeao-botao {
            padding: 16px 19px;
            background: #f6f7f8;
            color: #17365d;
            font-size: 1rem;
            line-height: 1.4;
        }

        .acordeao-botao:hover {
            background: #eef2f5;
        }

        .acordeao-conteudo {
            padding: 22px;
            border-top-color: #e5e8eb;
        }

        .causa-item {
            background: #f7f8f9;
            border-color: #e4e8eb;
            border-radius: 8px;
            font-size: 0.98rem;
        }

        .causa-item strong {
            color: #17365d;
            font-size: 1rem;
        }

        .lista-itens li {
            color: #465568;
            font-size: 1rem;
            line-height: 1.7;
        }

        .sub-timeline {
            border-left-color: #b18a4a;
        }

        .timeline-evento::before {
            background: #b18a4a;
            box-shadow: 0 0 0 2px rgba(177, 138, 74, 0.18);
        }

        .evento-ano {
            color: #80612f;
            font-size: 0.94rem;
        }

        .evento-titulo {
            color: #17365d;
            font-size: 1.08rem;
        }

        button, input, .capa-card {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        input:focus-visible,
        .capa-card:focus-visible {
            outline: 3px solid rgba(177, 138, 74, 0.55);
            outline-offset: 3px;
        }

        @media (max-width: 640px) {
            body {
                padding: 18px 12px 34px;
            }

            header {
                padding: 17px 8px 21px;
                margin-bottom: 18px;
            }

            header::after {
                font-size: 0.65rem;
                letter-spacing: 0.14em;
            }

            .busca-container {
                flex-direction: column;
                padding: 10px;
                margin-bottom: 20px;
            }

            .busca-container button {
                min-height: 46px;
            }

            .menu-navegacao {
                justify-content: flex-start;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 3px 2px 12px;
                margin-bottom: 18px;
                scrollbar-width: thin;
            }

            .btn-periodo {
                flex: 0 0 auto;
                white-space: nowrap;
                font-size: 0.88rem;
                padding: 9px 13px;
            }

            .conteudo-wrapper {
                padding: 20px 14px;
                background-attachment: scroll;
                border-radius: 13px;
            }

            .capa-grid {
                grid-template-columns: 1fr;
                gap: 13px;
            }

            .capa-card {
                min-height: 0;
                padding: 21px 19px;
            }

            .historico-card {
                padding: 21px 17px;
                margin-bottom: 15px;
            }

            .acordeao-botao {
                padding: 14px 15px;
                font-size: 0.96rem;
            }

            .acordeao-conteudo {
                padding: 17px 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }


        /* ===== LEITURA E TELAS PEQUENAS — ETAPA 45 ===== */
        .historico-card {
            min-width: 0;
        }

        .historico-card h2,
        .historico-card p,
        .causa-item,
        .lista-itens li,
        .timeline-evento {
            overflow-wrap: anywhere;
        }

        .secao-texto {
            max-width: 78ch;
            font-size: 1.04rem;
            line-height: 1.82;
            text-wrap: pretty;
        }

        .acordeao-botao {
            min-height: 52px;
            gap: 14px;
            text-wrap: pretty;
        }

        .acordeao-botao::after {
            flex: 0 0 auto;
            margin-left: 8px;
        }

        .acordeao-botao:focus-visible {
            position: relative;
            z-index: 1;
            outline: 3px solid #b18a4a;
            outline-offset: -3px;
        }

        .acordeao-conteudo {
            min-width: 0;
        }

        .lista-itens {
            padding-left: 1.35rem;
        }

        .sub-timeline {
            padding-left: 26px;
            margin-left: 7px;
        }

        .timeline-evento::before {
            left: -32px;
        }

        @media (max-width: 640px) {
            .historico-card {
                padding: 20px 15px;
            }

            .historico-card h2 {
                font-size: clamp(1.3rem, 6vw, 1.65rem);
                line-height: 1.32;
            }

            .historico-header {
                align-items: flex-start;
            }

            .historico-tag {
                max-width: 100%;
                white-space: normal;
                line-height: 1.45;
            }

            .historico-intervalo {
                line-height: 1.5;
            }

            .secao-texto,
            .lista-itens li,
            .causa-item {
                font-size: 1rem;
                line-height: 1.75;
            }

            .acordeao-botao {
                min-height: 54px;
                padding: 14px 13px;
                font-size: 0.96rem;
            }

            .acordeao-conteudo {
                padding: 16px 12px;
            }

            .grid-causas {
                grid-template-columns: minmax(0, 1fr);
            }

            .timeline-evento {
                margin-bottom: 27px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding-right: 9px;
                padding-left: 9px;
            }

            .conteudo-wrapper {
                padding-right: 10px;
                padding-left: 10px;
            }

            .historico-card {
                padding-right: 12px;
                padding-left: 12px;
            }
        }


        /* Etapa pedagógica 1: leitura orientada e debate */
        .perguntas-orientadoras {
            margin: 8px 0 18px 24px;
            padding-left: 12px;
        }

        .perguntas-orientadoras li {
            margin: 0 0 14px;
            padding-left: 5px;
            line-height: 1.65;
        }

        .nota-pedagogica {
            border-left: 3px solid #b08a45;

            margin-top: 14px;

            background: #f8fafc;
            font-size: 0.95em;
            line-height: 1.55;
        }

    

        /* ETAPA PEDAGÓGICA 2 — linha do tempo mais legível e semântica */
        .sub-timeline {
            list-style: none;
            margin: 8px 0 4px 8px;
            padding: 4px 0 4px 28px;
            border-left: 2px solid var(--accent-color, #b18a4a);

        .timeline-evento {
            margin: 0 0 26px;
            padding: 0 0 2px 4px;
            position: relative;
            min-width: 0;
        }

        .timeline-evento::before {
            left: -38px;
            top: 3px;
            width: 13px;
            height: 13px;
            background: var(--accent-color, #b18a4a);
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px var(--accent-color, #b18a4a);
        }

        .timeline-evento:last-child {
            margin-bottom: 0;
        }

        .evento-ano {
            display: inline-block;

        .evento-titulo {

            font-weight: 700;

        .timeline-evento .secao-texto {

            font-size: 0.98rem;
            line-height: 1.65;
        }

        @media (max-width: 480px) {
            .sub-timeline {
                margin-left: 2px;

                left: -32px;
            }

                font-size: 1rem;
            }

            .timeline-evento .secao-texto {
                font-size: 0.94rem;
            }
        }

    
        /* Etapa pedagógica 3 — mapas históricos contextualizados */
        .mapa-historico { margin: 14px 0 20px; padding: 16px; background: #f8f7f3; border: 1px solid #e1ded5; border-radius: 10px; }
        .mapa-historico h3 { margin: 0 0 6px; color: #17365d; font: 700 1.08rem Georgia, "Times New Roman", serif; }

        .mapa-historico img { display: block; width: 100%; max-height: 520px; object-fit: contain; background: #fff; border: 1px solid #e1e5e8; border-radius: 7px; }

        @media (max-width: 640px) { .mapa-historico { padding: 12px; } .mapa-historico img { max-height: 360px; } }

    

        /* Etapa 9 — atividades de interpretação documental */
        .atividade-fonte { margin-top: 8px; border-top: 1px solid #e1e7ee; padding-top: 12px; }
        .atividade-fonte summary { cursor: pointer; color: #174d7a; font-weight: 700; line-height: 1.5; padding: 5px 0; }

        .fontes-pagina { max-width: 1100px; margin: 0 auto; }

        /* Etapa 12 — ficha de acompanhamento formativo */

        .ficha-campo input:focus-visible, .ficha-campo textarea:focus-visible, .ficha-criterio select:focus-visible, .ficha-acoes button:focus-visible { outline: 3px solid #8bb7dc; outline-offset: 2px; }
        .ficha-rubrica { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0; padding: 14px; border: 1px solid #dce4eb; border-radius: 8px; }
        .ficha-rubrica legend { padding: 0 6px; color: #173f63; font-weight: 700; }
        .ficha-criterio { display: flex; flex-direction: column; gap: 9px; padding: 12px; border: 1px solid #e1e7ed; border-radius: 7px; background: #f9fbfc; }
        .ficha-criterio label { display: flex; flex-direction: column; gap: 5px; color: #29445f; font-size: .92rem; line-height: 1.5; }
        .ficha-criterio label span { color: #536174; font-weight: 400; }
        .ficha-campo-amplo { margin: 13px 0; }
        .ficha-campo textarea { resize: vertical; line-height: 1.5; }

        .ficha-botao-secundario { background: #fff; color: #173f63; }
        @media (max-width: 650px) { .ficha-form-grid, .ficha-rubrica { grid-template-columns: 1fr; } .ficha-acompanhamento { padding: 14px; } }
        @media print {

<body>

    <header>
        <h1 onclick="mostrarCapa()">Linha do Tempo Histórica</h1>
    </header>

    <!-- Barra de Pesquisa Avançada -->
    <div class="busca-container">
        <input type="text" id="input-busca" aria-label="Pesquisar no acervo histórico" placeholder="Pesquisar por palavra, ano (ex: 1500) ou século (ex: séc. XIX)..." onkeypress="verificarEnter(event)">
        <button onclick="executarBusca()">Pesquisar</button>
    </div>

    <!-- Menu de Navegação -->
    <nav class="menu-navegacao">
        <button class="btn-periodo" onclick="mostrarCapa()">Início / Capa</button>
        <button class="btn-periodo" onclick="carregarPeriodo('pre-historia.json', this)">Pré-História</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-antiga.json', this)">Idade Antiga</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-medieval.json', this)">Idade Média</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-moderna.json', this)">Idade Moderna</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-contemporanea.json', this)">Idade Contemporânea</button>
        <button class="btn-periodo" onclick="carregarPeriodo('brasil.json', this)">Brasil</button>
        <button class="btn-periodo" onclick="carregarPeriodo('atualidades.json', this)">Atualidades</button>
        <button class="btn-periodo" onclick="carregarPeriodo('direitos-humanos.json', this)">Direitos Humanos</button>
        <button class="btn-periodo" onclick="mostrarFontesHistoricas(this)">Fontes Históricas</button>
        <button class="btn-periodo" onclick="mostrarBancoAtividades(this)">Banco de Atividades</button>
        <button class="btn-periodo" onclick="mostrarAreaProfessor(this)">Área do Professor</button>
    </nav>

    <main class="container" id="app-container" aria-live="polite" aria-atomic="true" aria-busy="false">
        <!-- Conteúdo inicial injetado via JavaScript -->
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script>
        const periodosDisponiveis = [
            { arquivo: 'pre-historia.json', titulo: 'Pré-História', subtitulo: 'Origens e Povos Originários' },
            { arquivo: 'idade-antiga.json', titulo: 'Idade Antiga', subtitulo: 'Civilizações Clássicas e Antiguidade' },
            { arquivo: 'idade-medieval.json', titulo: 'Idade Média', subtitulo: 'Feudalismo e Cristandade' },
            { arquivo: 'idade-moderna.json', titulo: 'Idade Moderna', subtitulo: 'Expansão, Absolutismo e Renascimento' },
            { arquivo: 'idade-contemporanea.json', titulo: 'Idade Contemporânea', subtitulo: 'Guerras, Revoluções e Globalização' },
            { arquivo: 'brasil.json', titulo: 'Brasil', subtitulo: 'Da Colônia à República Atual' },
            { arquivo: 'atualidades.json', titulo: 'Atualidades', subtitulo: 'Cenário Mundial Recente (2019-2026)' },
            { arquivo: 'direitos-humanos.json', titulo: 'Direitos Humanos', subtitulo: 'Conquistas da Cidadania e Democracia' }
        ];

        let requisicaoAtual = 0;
        let mapasHistoricos = [];
        let mapasCarregados = false;

        async function carregarCatalogoMapas() {
            if (mapasCarregados) return;
            try {
                const resposta = await fetch('mapas-historicos.json');
                if (!resposta.ok) throw new Error('Catálogo de mapas indisponível');
                const dados = await resposta.json();
                mapasHistoricos = Array.isArray(dados) ? dados : [];
                mapasCarregados = true;
            } catch (erro) {
                console.warn('Mapas históricos não puderam ser carregados:', erro);
                mapasHistoricos = [];
            }
        }

        function escaparHTML(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[caractere]);
        }

        function formatarAno(ano) {
            const num = parseInt(ano, 10);
            if (isNaN(num)) return ano;
            if (num < 0) {
                return Math.abs(num).toLocaleString('pt-BR') + ' a.C.';
            } else {
                return num.toLocaleString('pt-BR') + ' d.C.';
            }
        }

        function alternarAcordeao(event) {
            const botao = event.currentTarget;
            botao.classList.toggle('ativo');
            const conteudo = botao.nextElementSibling;
            conteudo.classList.toggle('aberto');
            botao.setAttribute('aria-expanded', String(conteudo.classList.contains('aberto')));
        }

        function criarAcordeao(titulo, conteudoHtml) {
            return `
                <div class="acordeao-container">
                    <button type="button" class="acordeao-botao" aria-expanded="false" onclick="alternarAcordeao(event)">${escaparHTML(titulo)}</button>
                    <div class="acordeao-conteudo">
                        ${conteudoHtml}
                    </div>
                </div>
            `;
        }

        function mostrarCapa() {
            requisicaoAtual++;
            const container = document.getElementById('app-container');
            container.setAttribute('aria-busy', 'false');
            document.querySelectorAll('.btn-periodo').forEach(btn => btn.classList.remove('ativo'));
            document.querySelector('.menu-navegacao button').classList.add('ativo');

            let htmlCapa = `
                <div class="conteudo-wrapper">
                    <div class="capa-container">
                        <h2 class="capa-titulo-secao">Explore os Módulos Históricos</h2>
                        <p class="capa-sub-secao">Selecione abaixo um dos eixos temáticos para iniciar a navegação:</p>
                        <div class="capa-grid">
            `;
            
            periodosDisponiveis.forEach(p => {
                htmlCapa += `
                    <button type="button" class="capa-card" onclick="carregarPorNomeArquivo('${p.arquivo}')">
                        <div>
                            <h3>${escaparHTML(p.titulo)}</h3>
                            <p>${escaparHTML(p.subtitulo)}</p>
                        </div>
                        <div class="capa-card-footer">
                            Acessar Módulo &rarr;
                        </div>
                    </button>
                `;
            });
            htmlCapa += `</div></div></div>`;
            container.innerHTML = htmlCapa;
        }

        function carregarPorNomeArquivo(arquivo) {
            const botoes = document.querySelectorAll('.btn-periodo');
            botoes.forEach(btn => {
                if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(arquivo)) {
                    carregarPeriodo(arquivo, btn);
                }
            });
        }

        async function carregarPeriodo(arquivoJson, botaoElemento) {
            const requisicao = ++requisicaoAtual;
            document.querySelectorAll('.btn-periodo').forEach(btn => btn.classList.remove('ativo'));
            if (botaoElemento) botaoElemento.classList.add('ativo');

            const container = document.getElementById('app-container');
            container.setAttribute('aria-busy', 'true');
            container.innerHTML = '<div class="conteudo-wrapper"><p role="status" style="text-align: center; color: #ffffff; font-size: 1.3rem; padding: 40px;">Carregando conteúdo do módulo...</p></div>';
            
            try {
                const resposta = await fetch(arquivoJson);
                if (!resposta.ok) throw new Error('Ficheiro não encontrado');
                
                const itensHistoricos = await resposta.json();
                await carregarCatalogoMapas();
                if (requisicao !== requisicaoAtual) return;
                renderizarCards(itensHistoricos, container);

            } catch (error) {
                if (requisicao !== requisicaoAtual) return;
                console.error("Erro ao carregar dados:", error);
                container.setAttribute('aria-busy', 'false');

                const fonteSegura = typeof mapa.fonte === 'string' && mapa.fonte.startsWith('https://commons.wikimedia.org/wiki/File:');
                const licencaSegura = typeof mapa.licenca_url === 'string' && mapa.licenca_url.startsWith('https://');

                const creditoLicenca = licencaSegura ? ' — <a href="' + escaparHTML(mapa.licenca_url) + '" target="_blank" rel="noopener noreferrer">consultar licença</a>' : '';

        function romanoParaDecimal(romano) {
            const r = romano.toUpperCase();
            const lookup = {M:1000, D:500, C:100, L:50, X:10, V:5, I:1};
            let total = 0;
            for(let i = 0; i < r.length; i++){
                const atual = lookup[r[i]];
                const proximo = lookup[r[i+1]];
                if(proximo && atual < proximo){
                    total += proximo - atual;
                    i++;
                } else {
                    total += atual;
                }
            }
            return total;
        }

        async function executarBusca() {
            const termo = document.getElementById('input-busca').value.trim().toLowerCase();
            if (!termo) return;

            document.querySelectorAll('.btn-periodo').forEach(btn => btn.classList.remove('ativo'));
            const container = document.getElementById('app-container');
            const requisicao = ++requisicaoAtual;
            container.setAttribute('aria-busy', 'true');
            container.innerHTML = '<div class="conteudo-wrapper"><p role="status" style="text-align: center; color: #ffffff; font-size: 1.3rem; padding: 40px;">Pesquisando em todos os módulos...</p></div>';

            await carregarCatalogoMapas();
            let resultadosGlobais = [];

            let buscaSeculoAnoInicio = null;
            let buscaSeculoAnoFim = null;
            const regexSeculo = /(?:século|sec\.?)\s*([ivxlcdm]+|\d+)\s*(a\.?\s*c\.?)?/i;
            const matchSec = termo.match(regexSeculo);

            if (matchSec) {
                let numSeculo;
                if (!isNaN(matchSec[1])) {
                    numSeculo = parseInt(matchSec[1], 10);
                } else {
                    numSeculo = romanoParaDecimal(matchSec[1]);
                }
                if (numSeculo) {
                    const antesDeCristo = Boolean(matchSec[2]);
                    if (antesDeCristo) {
                        buscaSeculoAnoInicio = -(numSeculo * 100);
                        buscaSeculoAnoFim = -((numSeculo - 1) * 100 + 1);
                    } else {
                        buscaSeculoAnoInicio = (numSeculo - 1) * 100 + 1;
                        buscaSeculoAnoFim = numSeculo * 100;
                    }
                }
            }

            for (let p of periodosDisponiveis) {
                try {
                    const res = await fetch(p.arquivo);
                    if (res.ok) {
                        const dados = await res.json();
                        dados.forEach(item => {
                            let atendeCriterio = false;

                            if (buscaSeculoAnoInicio !== null) {
                                if (item.ano_inicio <= buscaSeculoAnoFim && item.ano_fim >= buscaSeculoAnoInicio) {
                                    atendeCriterio = true;
                                }
                            }

                            const anoNum = parseInt(termo, 10);
                            if (!isNaN(anoNum) && !matchSec) {
                                if (item.ano_inicio <= anoNum && item.ano_fim >= anoNum) {
                                    atendeCriterio = true;
                                }
                                if (item.linha_do_tempo && item.linha_do_tempo.some(ev => ev.ano === anoNum)) {
                                    atendeCriterio = true;
                                }
                            }

                            const stringItem = JSON.stringify(item).toLowerCase();
                            if (stringItem.includes(termo)) {
                                atendeCriterio = true;
                            }

                            if (atendeCriterio) {
                                resultadosGlobais.push(item);
                            }
                        });
                    }
                } catch (e) {
                    console.error(`Erro ao buscar no ficheiro ${p.arquivo}:`, e);
                }
            }

            if (requisicao !== requisicaoAtual) return;
            renderizarCards(resultadosGlobais, container);
            const wrapperResultados = container.querySelector('.conteudo-wrapper');
            if (wrapperResultados) {
                const resumo = document.createElement('p');
                resumo.className = 'resultado-busca';
                resumo.setAttribute('role', 'status');
                resumo.textContent = `${resultadosGlobais.length} ${resultadosGlobais.length === 1 ? 'resultado encontrado' : 'resultados encontrados'} para “${document.getElementById('input-busca').value.trim()}”.`;
                wrapperResultados.insertBefore(resumo, wrapperResultados.firstChild);
            }
        }

            if (!email) {

            try {

                const { error } = await professorSupabase.auth.resetPasswordForEmail(email, { redirectTo });
                if (error) throw error;
                status.textContent = 'Se o endereço estiver cadastrado, enviaremos um link para redefinir a senha. Verifique também a caixa de spam.';

            } finally {

            const botao = evento.currentTarget.querySelector('button[type="submit"]');
            const email = document.getElementById('professor-email').value.trim();
            const password = document.getElementById('professor-senha').value;
            status.textContent = 'Verificando acesso...';
            botao.disabled = true;
            try {
                const { data, error } = await professorSupabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await verificarPermissaoProfessor(data.user);
                await carregarConteudoProfessor(data.user);
            } catch (erro) {
                await professorSupabase.auth.signOut();
                status.textContent = erro.message || 'Não foi possível validar o acesso.';
            } finally {
                botao.disabled = false;
            }
        }

        async function verificarSessaoProfessor() {
            const status = document.getElementById('professor-status');
            try {
                const { data: { session } } = await professorSupabase.auth.getSession();
                if (!session) return;
                await verificarPermissaoProfessor(session.user);
                await carregarConteudoProfessor(session.user);
            } catch (erro) {
                await professorSupabase.auth.signOut();
                if (status) status.textContent = erro.message || 'Entre com uma conta de professor autorizada.';
            }
        }

        function mostrarFontesHistoricas(botaoElemento) {
            requisicaoAtual++;
            document.querySelectorAll('.btn-periodo').forEach(btn => btn.classList.remove('ativo'));
            if (botaoElemento) botaoElemento.classList.add('ativo');
            const container = document.getElementById('app-container');
            container.setAttribute('aria-busy', 'false');
            container.innerHTML = `
                <section class="conteudo-wrapper fontes-pagina" aria-labelledby="titulo-fontes">
                    <h2 id="titulo-fontes">Fontes Históricas e Documentos</h2>
                    <p class="fontes-intro">A História é construída a partir da investigação de vestígios do passado. Consulte acervos institucionais, compare documentos e observe quem produziu cada registro, em qual contexto e com quais interesses. Os links levam aos portais responsáveis pelos acervos; a disponibilidade de documentos digitalizados varia conforme a instituição e a coleção.</p>
                    <div class="fontes-filtros">
                        <input type="search" id="buscar-fontes" aria-label="Buscar fontes históricas" placeholder="Buscar por instituição, documento, período ou tema..." oninput="filtrarFontesHistoricas()">
                        <select id="categoria-fontes" aria-label="Filtrar fontes por categoria" onchange="filtrarFontesHistoricas()">
                            <option value="">Todas as categorias</option>
                            <option value="Acervo digital">Acervos digitais</option>
                            <option value="Guia de acervos">Guias de acervos</option>
                            <option value="Jornais e revistas">Jornais e revistas</option>
                            <option value="Documentos políticos">Documentos políticos</option>
                            <option value="Acervo regional">Acervos regionais</option>
                        </select>
                    </div>
                    <p id="fontes-contagem" class="fontes-contagem" aria-live="polite"></p>
                    <div id="lista-fontes" class="fontes-lista"></div>
                    <section class="documentos-secao" aria-labelledby="titulo-documentos-historicos">
                        <h3 id="titulo-documentos-historicos">Documentos ligados aos acontecimentos históricos</h3>
                        <p class="fontes-intro">Consulte documentos originais e registros oficiais relacionados a temas estudados nos módulos do HistoryWeb. Observe a linguagem da época, quem produziu o documento e quais grupos ou experiências não aparecem nele.</p>
                        <div id="lista-documentos-historicos" class="fontes-lista"></div>
                    </section>
                    <section class="fontes-metodo" aria-labelledby="titulo-analise-fonte">
                        <h3 id="titulo-analise-fonte">Como analisar um documento histórico?</h3>
                        <ol>
                            <li><strong>Identificação:</strong> quem produziu o documento, quando e onde?</li>
                            <li><strong>Contexto:</strong> que acontecimentos e condições históricas ajudam a compreendê-lo?</li>
                            <li><strong>Finalidade e público:</strong> por que foi produzido e a quem se destinava?</li>
                            <li><strong>Perspectiva e limites:</strong> que interesses, silêncios ou grupos aparecem — ou não aparecem — no registro?</li>
                            <li><strong>Comparação:</strong> que outras fontes podem confirmar, complementar ou questionar essa interpretação?</li>
                        </ol>
                        <p class="fontes-aviso">Um documento não é um retrato neutro e completo do passado. Seu valor histórico depende das perguntas feitas, da crítica da fonte e da comparação com outros registros.</p>
                    </section>
                </section>`;
            filtrarFontesHistoricas();
            renderizarDocumentosHistoricos('');
        }

        function filtrarFontesHistoricas() {
            const busca = (document.getElementById('buscar-fontes')?.value || '').trim().toLocaleLowerCase('pt-BR');
            const categoria = document.getElementById('categoria-fontes')?.value || '';
            const filtradas = fontesHistoricas.filter(fonte => {
                const texto = [fonte.titulo, fonte.instituicao, fonte.tipo, fonte.periodo, fonte.acesso, fonte.categoria].join(' ').toLocaleLowerCase('pt-BR');
                return (!busca || texto.includes(busca)) && (!categoria || fonte.categoria === categoria);
            });
            const lista = document.getElementById('lista-fontes');
            const contagem = document.getElementById('fontes-contagem');
            if (!lista || !contagem) return;
            contagem.textContent = filtradas.length + (filtradas.length === 1 ? ' acervo encontrado' : ' acervos encontrados');
            lista.innerHTML = filtradas.length ? filtradas.map(fonte => `
                <article class="fonte-card">
                    <span class="fonte-meta">${escaparTextoFonte(fonte.categoria)} · ${escaparTextoFonte(fonte.periodo)}</span>
                    <h3>${escaparTextoFonte(fonte.titulo)}</h3>
                    <p><strong>Instituição:</strong> ${escaparTextoFonte(fonte.instituicao)}</p>
                    <p><strong>Tipos de fontes:</strong> ${escaparTextoFonte(fonte.tipo)}</p>
                    <p><strong>Forma de acesso:</strong> ${escaparTextoFonte(fonte.acesso)}</p>
                    <p class="fonte-acesso"><a href="${escaparTextoFonte(fonte.url)}" target="_blank" rel="noopener noreferrer">Acessar acervo institucional</a></p>
                </article>`).join('') : '<p role="status">Nenhum acervo corresponde à busca. Tente outro termo ou categoria.</p>';
            renderizarDocumentosHistoricos(busca);
        }

        // Inicializa exibindo a Capa Principal
        window.onload = mostrarCapa;
    </script>
</body>
</html>
