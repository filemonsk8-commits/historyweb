<style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #334155;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            font-size: 1.25rem; /* Aumentado de 1.15rem para 1.25rem */
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 3rem; /* Título principal maior */
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 700;
        }

        /* Barra de Pesquisa */
        .busca-container {
            max-width: 950px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 12px;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }

        .busca-container input {
            flex: 1;
            padding: 14px 18px;
            font-size: 1.2rem; /* Texto da busca maior */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            color: var(--text-main);
        }

        .busca-container input:focus {
            border-color: var(--primary-color);
        }

        .busca-container button {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0 24px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .busca-container button:hover {
            background: var(--primary-hover);
        }

        /* Menu de Navegação */
        .menu-navegacao {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .btn-periodo {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            font-size: 1.1rem; /* Botões do menu maiores */
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-periodo:hover {
            background: #f1f5f9;
            border-color: var(--primary-color);
        }

        .btn-periodo.ativo {
            background: #1e40af;
            color: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* Envoltório com Fundo Personalizado (fundo.jpg) */
        .conteudo-wrapper {
            background-image: linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.78)), url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .capa-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .capa-titulo-secao {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .capa-sub-secao {
            color: #e2e8f0;
            margin-bottom: 40px;
            font-size: 1.35rem; /* Subtítulo da capa maior */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .capa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            padding: 10px 0;
        }

        .capa-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 32px 24px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .capa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
            background: #ffffff;
            border-color: var(--primary-color);
        }

        .capa-card h3 {
            font-size: 1.6rem; /* Títulos dos cards da capa maiores */
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .capa-card p {
            font-size: 1.15rem; /* Textos descritivos da capa maiores */
            color: var(--text-muted);
            line-height: 1.6;
        }

        .capa-card-footer {
            margin-top: 22px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Cards Históricos */
        .historico-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .historico-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        @media (min-width: 640px) {
            .historico-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .historico-tag {
            background: #dbeafe;
            color: var(--primary-color);
            font-size: 1.15rem; /* Tag do período maior */
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            width: fit-content;
        }

        .historico-intervalo {
            font-size: 1.2rem; /* Anos do intervalo maiores */
            color: var(--text-muted);
            font-weight: 600;
        }

        .historico-card h2 {
            font-size: 2.1rem; /* Título principal do evento histórico maior */
            color: var(--text-main);
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .secao-texto {
            font-size: 1.25rem; /* Textos de parágrafos gerais maiores */
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 14px;
        }

        .acordeao-container {
            margin-top: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
        }

        .acordeao-botao {
            width: 100%;
            background: #f8fafc;
            border: none;
            padding: 20px 24px;
            text-align: left;
            font-size: 1.3rem; /* Botões dos acordeões maiores */
            font-weight: 700;
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .acordeao-botao:hover {
            background: #f1f5f9;
        }

        .acordeao-botao::after {
            content: '▼';
            font-size: 1rem;
            transition: transform 0.3s;
        }

        .acordeao-botao.ativo::after {
            transform: rotate(180deg);
        }

        .acordeao-conteudo {
            display: none;
            padding: 28px;
            background: #ffffff;
            border-top: 1px solid #cbd5e1;
        }

        .acordeao-conteudo.aberto {
            display: block;
        }

        .grid-causas {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        @media (min-width: 640px) {
            .grid-causas {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .causa-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 8px;
            font-size: 1.2rem; /* Texto interno de causas maior */
            color: var(--text-muted);
            line-height: 1.6;
        }

        .causa-item strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 6px;
            font-size: 1.25rem;
        }

        .lista-itens {
            padding-left: 24px;
            margin-top: 10px;
        }

        .lista-itens li {
            font-size: 1.2rem; /* Itens de listas maiores */
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.7;
        }

        .sub-timeline {
            position: relative;
            padding-left: 32px;
            border-left: 3px solid var(--primary-color);
            margin-left: 10px;
        }

        .timeline-evento {
            position: relative;
            margin-bottom: 35px;
        }

        .timeline-evento:last-child {
            margin-bottom: 0;
        }

        .timeline-evento::before {
            content: '';
            position: absolute;
            left: -37px;
            top: 4px;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .evento-ano {
            font-size: 1.15rem; /* Anos na sub-timeline maiores */
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .evento-titulo {
            font-size: 1.35rem; /* Títulos de eventos na sub-timeline maiores */
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .erro-msg {
            text-align: center;
            color: #ef4444;
            padding: 30px;
            font-size: 1.3rem;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
        }
    </style>
