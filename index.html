<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo Histórica - Períodos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Menu de Navegação entre os JSONs */
        .menu-navegacao {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .btn-periodo {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-periodo:hover, .btn-periodo.ativo {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Cartão Histórico Principal */
        .historico-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .historico-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        @media (min-width: 640px) {
            .historico-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .historico-tag {
            background: #dbeafe;
            color: var(--primary-color);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            width: fit-content;
        }

        .historico-intervalo {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .historico-card h2 {
            font-size: 1.35rem;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .secao-bloco {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e2e8f0;
        }

        .secao-titulo {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .secao-texto, .secao-lista li {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .secao-lista {
            padding-left: 20px;
            margin-top: 5px;
        }

        /* Grid de Causas */
        .grid-causas {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (min-width: 640px) {
            .grid-causas {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .causa-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .causa-item strong {
            color: var(--text-main);
        }

        /* Sub-timeline Interna */
        .sub-timeline {
            position: relative;
            padding-left: 25px;
            margin-top: 15px;
            border-left: 3px solid #e2e8f0;
        }

        .timeline-evento {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-evento:last-child {
            margin-bottom: 0;
        }

        .timeline-evento::before {
            content: '';
            position: absolute;
            left: -31px;
            top: 4px;
            width: 13px;
            height: 13px;
            background: var(--primary-color);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .evento-ano {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 2px;
        }

        .evento-titulo {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .erro-msg {
            text-align: center;
            color: #ef4444;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Linha do Tempo Histórica</h1>
        <p>Selecione um período para carregar os dados</p>
    </header>

    <!-- Menu de navegação correspondente aos arquivos JSON -->
    <nav class="menu-navegacao">
        <button class="btn-periodo ativo" onclick="carregarPeriodo('pre-historia.json', this)">Pré-História</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-antiga.json', this)">Idade Antiga</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-medieval.json', this)">Idade Média</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-moderna.json', this)">Idade Moderna</button>
        <button class="btn-periodo" onclick="carregarPeriodo('idade-contemporanea.json', this)">Idade Contemporânea</button>
        <button class="btn-periodo" onclick="carregarPeriodo('atualidades.json', this)">Atualidades</button>
        <button class="btn-periodo" onclick="carregarPeriodo('brasil.json', this)">Brasil</button>
    </nav>

    <main class="container" id="app-container">
        <!-- O conteúdo será injetado dinamicamente aqui -->
    </main>

    <script>
        async function carregarPeriodo(arquivoJson, botaoElemento) {
            // Atualiza o botão ativo no menu
            document.querySelectorAll('.btn-periodo').forEach(btn => btn.classList.remove('ativo'));
            botaoElemento.classList.add('ativo');

            const container = document.getElementById('app-container');
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Carregando dados...</p>';
            
            try {
                const resposta = await fetch(arquivoJson);
                if (!resposta.ok) throw new Error('Arquivo não encontrado');
                
                const itensHistoricos = await resposta.json();
                container.innerHTML = '';

                itensHistoricos.forEach(item => {
                    // Renderiza marcos da linha do tempo interna
                    let htmlMarcos = '';
                    if (item.linha_do_tempo && item.linha_do_tempo.length > 0) {
                        htmlMarcos = item.linha_do_tempo.map(ev => `
                            <div class="timeline-evento">
                                <div class="evento-ano">${ev.ano}</div>
                                <div class="evento-titulo">${ev.titulo}</div>
                                <div class="secao-texto">${ev.descricao}</div>
                            </div>
                        `).join('');
                    }

                    // Renderiza causas multidimensionais se existirem
                    let htmlCausas = '';
                    if (item.causas) {
                        htmlCausas = Object.entries(item.causas).map(([chave, valor]) => `
                            <div class="causa-item"><strong>${chave.toUpperCase()}:</strong> ${valor}</div>
                        `).join('');
                    }

                    // Monta o cartão completo estruturado
                    const card = document.createElement('div');
                    card.className = 'historico-card';
                    card.innerHTML = `
                        <div class="historico-header">
                            <span class="historico-tag">${item.periodo}</span>
                            <span class="historico-intervalo">De ${item.ano_inicio} até ${item.ano_fim}</span>
                        </div>
                        <h2>${item.titulo_principal}</h2>
                        <p class="secao-texto"><strong>Tema:</strong> ${item.tema}</p>
                        <p class="secao-texto" style="margin-top: 8px;">${item.contexto}</p>

                        ${htmlCausas ? `
                            <div class="secao-bloco">
                                <div class="secao-titulo">Causas e Dimensões</div>
                                <div class="grid-causas">${htmlCausas}</div>
                            </div>
                        ` : ''}

                        ${htmlMarcos ? `
                            <div class="secao-bloco">
                                <div class="secao-titulo">Marcos da Linha do Tempo</div>
                                <div class="sub-timeline">${htmlMarcos}</div>
                            </div>
                        ` : ''}
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                container.innerHTML = `
                    <div class="erro-msg">
                        <p>O arquivo <code>${arquivoJson}</code> ainda não foi criado ou está inacessível.</p>
                        <p style="font-size: 0.85rem; margin-top: 5px;">Crie este arquivo na mesma pasta do projeto para exibir os dados deste período.</p>
                    </div>
                `;
            }
        }

        // Carrega a Pré-História por padrão ao abrir a página
        carregarPeriodo('pre-historia.json', document.querySelector('.btn-periodo'));
    </script>
</body>
</html>
